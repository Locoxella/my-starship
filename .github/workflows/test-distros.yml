name: Multi-Distro Verification Matrix

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      distro:
        description: 'Select Linux distribution to test'
        type: choice
        options:
          - 'all (Top 5 Distros)'
          - 'fedora'
          - 'ubuntu'
          - 'debian'
          - 'archlinux'
          - 'opensuse'
        default: 'all (Top 5 Distros)'
      custom_image:
        description: 'Optional custom Docker image:tag (e.g. fedora:40, ubuntu:22.04). Overrides selector.'
        type: string
        required: false
        default: ''

jobs:
  generate-matrix:
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.set-matrix.outputs.images }}
    steps:
      - id: set-matrix
        name: Determine images to test
        run: |
          CUSTOM="${{ inputs.custom_image }}"
          DISTRO="${{ inputs.distro }}"

          if [ -n "$CUSTOM" ]; then
            echo "Custom image provided: $CUSTOM"
            IMAGES="[\"$CUSTOM\"]"
          elif [ "$DISTRO" = "fedora" ]; then
            IMAGES='["fedora:latest"]'
          elif [ "$DISTRO" = "ubuntu" ]; then
            IMAGES='["ubuntu:latest"]'
          elif [ "$DISTRO" = "debian" ]; then
            IMAGES='["debian:latest"]'
          elif [ "$DISTRO" = "archlinux" ]; then
            IMAGES='["archlinux:latest"]'
          elif [ "$DISTRO" = "opensuse" ]; then
            IMAGES='["opensuse/tumbleweed:latest"]'
          else
            IMAGES='["fedora:latest", "ubuntu:latest", "debian:latest", "archlinux:latest", "opensuse/tumbleweed:latest"]'
          fi

          echo "images=$IMAGES" >> "$GITHUB_OUTPUT"

  test-distro:
    needs: generate-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJson(needs.generate-matrix.outputs.images) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install VHS & Host Dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg
          sudo curl -fsSL https://github.com/tsl0922/ttyd/releases/download/1.7.7/ttyd.x86_64 -o /usr/local/bin/ttyd
          sudo chmod +x /usr/local/bin/ttyd
          curl -fsSL https://github.com/charmbracelet/vhs/releases/download/v0.12.0/vhs_0.12.0_Linux_x86_64.tar.gz | tar -xz
          sudo install -m 755 vhs_0.12.0_Linux_x86_64/vhs /usr/local/bin/vhs
          ./dotfiles/install_nerd_font.sh

      - name: Test Container & Record Live VHS Demo
        run: |
          ./tests/run_container_test.sh "${{ matrix.image }}"

      - name: Prepare Artifact Name
        if: always()
        id: art
        run: |
          SAFE_NAME=$(echo "${{ matrix.image }}" | tr '/:' '--')
          echo "name=$SAFE_NAME" >> "$GITHUB_OUTPUT"

      - name: Upload Live Preview GIF Artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: preview-${{ steps.art.outputs.name }}
          path: /tmp/previews/*.gif
          if-no-files-found: ignore

      - name: Upload Container Live Log Artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: live-log-${{ steps.art.outputs.name }}
          path: /tmp/live_container_*.log
          if-no-files-found: ignore

  publish-live-previews:
    name: Publish Live Previews to ci-previews
    needs: test-distro
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download All Preview Artifacts
        uses: actions/download-artifact@v7
        with:
          path: /tmp/downloaded-artifacts

      - name: Push Previews to ci-previews Branch
        if: github.ref == 'refs/heads/main'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin ci-previews
          git checkout ci-previews
          mkdir -p previews
          find /tmp/downloaded-artifacts -name "preview_*.gif" -exec cp {} previews/ \;
          git add previews/
          git commit -m "chore(ci): update live distro previews for run ${{ github.run_id }} [skip ci]" || echo "No preview changes to commit"
          git push origin ci-previews --force
