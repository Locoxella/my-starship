name: Multi-Distro Verification Matrix

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      distro:
        description: 'Select Linux distribution to test'
        type: choice
        options:
          - 'all (Top 5 Distros)'
          - 'fedora'
          - 'ubuntu'
          - 'debian'
          - 'archlinux'
          - 'opensuse'
        default: 'all (Top 5 Distros)'
      custom_image:
        description: 'Optional custom Docker image:tag (e.g. fedora:40, ubuntu:22.04). Overrides selector.'
        type: string
        required: false
        default: ''

jobs:
  generate-matrix:
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.set-matrix.outputs.images }}
    steps:
      - id: set-matrix
        name: Determine images to test
        run: |
          CUSTOM="${{ inputs.custom_image }}"
          DISTRO="${{ inputs.distro }}"

          if [ -n "$CUSTOM" ]; then
            echo "Custom image provided: $CUSTOM"
            IMAGES="[\"$CUSTOM\"]"
          elif [ "$DISTRO" = "fedora" ]; then
            IMAGES='["fedora:latest"]'
          elif [ "$DISTRO" = "ubuntu" ]; then
            IMAGES='["ubuntu:latest"]'
          elif [ "$DISTRO" = "debian" ]; then
            IMAGES='["debian:latest"]'
          elif [ "$DISTRO" = "archlinux" ]; then
            IMAGES='["archlinux:latest"]'
          elif [ "$DISTRO" = "opensuse" ]; then
            IMAGES='["opensuse/tumbleweed:latest"]'
          else
            # Default for all or automated push/pull_request
            IMAGES='["fedora:latest", "ubuntu:latest", "debian:latest", "archlinux:latest", "opensuse/tumbleweed:latest"]'
          fi

          echo "images=$IMAGES" >> "$GITHUB_OUTPUT"

  test-distro:
    needs: generate-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJson(needs.generate-matrix.outputs.images) }}
    container:
      image: ${{ matrix.image }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Bootstrap container dependencies & shells
        run: |
          ./tests/bootstrap_distro.sh

      - name: Run Starship & Tools Auto-Configurator
        run: |
          ./dotfiles/setup_starship.sh

      - name: Execute Automated Test Suite (Binaries, Fonts, Hooks & Idempotency)
        env:
          TARGET_IMAGE: ${{ matrix.image }}
        run: |
          ./tests/verify_installation.sh

      - name: Prepare Artifact Name
        if: always()
        id: art
        run: |
          SAFE_NAME=$(echo "${{ matrix.image }}" | tr '/:' '--')
          echo "name=live-log-$SAFE_NAME" >> "$GITHUB_OUTPUT"

      - name: Upload Container Live Log Artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.art.outputs.name }}
          path: /tmp/live_container_*.log
          if-no-files-found: ignore

      - name: Report Early Setup Failure
        if: failure()
        run: |
          if [ -n "$GITHUB_STEP_SUMMARY" ] && [ ! -f /tmp/.summary_written ]; then
            echo "## 📦 Container Execution Failed: \`${{ matrix.image }}\`" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "> ❌ **Failed during container bootstrap or tool configuration before test suite execution.**" >> "$GITHUB_STEP_SUMMARY"
            echo "Please inspect the preceding step logs for details." >> "$GITHUB_STEP_SUMMARY"
            echo "---" >> "$GITHUB_STEP_SUMMARY"
          fi

  record-live-demo:
    name: Record Live VHS Demo
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install System Dependencies & VHS
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg ttyd fastfetch
          curl -fsSL https://github.com/charmbracelet/vhs/releases/download/v0.12.0/vhs_0.12.0_Linux_x86_64.tar.gz | tar -xz
          sudo install -m 755 vhs_0.12.0_Linux_x86_64/vhs /usr/local/bin/vhs
          vhs --version

      - name: Run Starship & Tools Auto-Configurator
        run: |
          ./dotfiles/setup_starship.sh

      - name: Render Live VHS Tape
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          vhs assets/demo.tape

      - name: Upload Live VHS Demo Artifact
        uses: actions/upload-artifact@v7
        with:
          name: live-vhs-demo
          path: assets/demo.gif
